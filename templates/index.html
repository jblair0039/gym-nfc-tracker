<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gym Weight Tracker</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<div class="container">

    <h1>Gym Check-In</h1>

    <div class="datetime">

        <div id="date"></div>

        <div id="time"></div>

    </div>

    <form id="weightForm">

        <label for="name">
            Name
        </label>

        <input
            id="name"
            type="text"
            placeholder="Enter your name"
            required
        >

        <label for="weight">
            Current Weight
        </label>

        <div class="weight-input">

            <input
                id="weight"
                type="number"
                step="0.1"
                placeholder="181"
                required
            >

            <span>lb</span>

        </div>

        <button type="submit">
            Log Weight
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

function updateClock() {

    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleDateString(
            "en-US",
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );

    document.getElementById("time").textContent =
        now.toLocaleTimeString();

}

updateClock();

setInterval(updateClock, 1000);


document
    .getElementById("weightForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value;

            const weight =
                document.getElementById("weight").value;


            const response =
                await fetch(
                    "/log",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            weight: weight
                        })
                    }
                );


            const result =
                await response.json();


            const message =
                document.getElementById("message");


            if (response.ok) {

                message.textContent =
                    "Weight logged successfully.";

                document
                    .getElementById("weight")
                    .value = "";

            }
            else {

                message.textContent =
                    result.error ||
                    "Unable to save weight.";

            }

        }
    );

</script>

</body>

</html>
